# gitleaks configuration (scripts/ci/gitleaks.sh). Default rules apply in full;
# the allowlists below are deliberately narrow. Review any addition: an allowlist
# entry must name exactly what it excuses and why it cannot be a credential.
title = "voice-support-platform"

[extend]
useDefault = true

# HashiCorp Security's PUBLIC PGP key fingerprint, pinned so the provider mirror can
# verify SHA256SUMS signatures (published at https://www.hashicorp.com/security).
[[allowlists]]
description = "Public HashiCorp release-signing key fingerprint"
regexTarget = "match"
regexes = ['''HASHICORP_KEY_FPR="C874011F0AB405110D02105534365D9472D7468F"''']

# SYNTHETIC opaque fixture identifiers (prefix_synth...) from platform tests and the
# synthetic world. They are generated labels, never credentials.
[[allowlists]]
description = "SYNTHETIC opaque fixture identifiers"
regexTarget = "secret"
regexes = ['''^[a-z][a-z0-9]{1,11}_synth[A-Za-z0-9_-]*$''']

# Prose in Markdown documentation that the generic rule mistakes for a key
# (all-lowercase words joined by '/' or '-'; real keys contain digits or mixed case).
[[allowlists]]
description = "Lowercase prose fragments in docs"
condition = "AND"
paths = ['''(^|/)docs/.*\.md$''']
regexTarget = "secret"
regexes = ['''^[a-z]+([/-][a-z]+)*$''']

# SYNTHETIC idempotency keys in test files only (*.test.ts under platform/src or
# platform/test). They are request-deduplication keys for local test calls, not
# credentials; the generic rule fires because the variable or field is named "key".
# Shapes: "idem_" + 8..40 alphanumerics, or an RFC 4122 UUID. Paths are anchored to
# test files so the same shapes elsewhere are still scanned.
[[allowlists]]
description = "SYNTHETIC idempotency-key fixtures in platform tests"
condition = "AND"
paths = ['''(^|/)platform/(src|test)/.+\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^idem_[A-Za-z0-9_]{8,40}$''', '''^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$''']

# Platform opaque identifiers that carry no authority (audit event, action, receipt,
# policy decision, correlation, call, transfer, workflow, run and similar ids, created
# by platform/src/shared/ids.ts newId: "<prefix>_" + random base64url). Random ids can
# contain "key"-like substrings and trip the generic rule. Bearer-like prefixes are
# deliberately NOT listed (ses_ session refs, non_ nonces, jti_, kid_, otc_, idempotency
# keys), so a leaked session reference or challenge is still reported.
[[allowlists]]
description = "Non-bearer platform opaque identifiers"
regexTarget = "secret"
regexes = ['''^(aud|act|rcp|pdc|cor|cal|xfr|hnd|hof|wf|wft|wfe|rcn|run|req|srq|spr|sr|iss|int|sev|seg|del|ded|rvw|rel|evt|apt|clm|bud|ksw)_[A-Za-z0-9_-]{16,64}$''']
