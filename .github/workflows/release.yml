# Release: build the platform image, scan it, sign it keyless (Sigstore / GitHub OIDC),
# attach the CycloneDX SBOM as a signed attestation, generate the release manifest and
# sign it. NOT RUN from the authoring environment: it needs a container registry, an
# AWS role and approval to incur cost (OPS-05).
#
# Required GitHub environment "release" (variables, no secrets):
#   AWS_REGION, RELEASE_ROLE_ARN (OIDC role allowed to push to ECR), ECR_REPOSITORY
#
# Third-party actions are pinned by version TAG. PREREQUISITE before production: pin
# every `uses:` to a full commit SHA (could not be resolved offline).
name: release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment the release manifest is generated for"
        type: choice
        required: true
        options: [sandbox, staging, production]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    name: build, scan, sign, attest, manifest
    # Keyless signatures bind the workflow identity at refs/heads/main; deploy.yml
    # verifies exactly that identity.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write # AWS OIDC federation and Sigstore keyless signing
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5 # pin to full commit SHA before production
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4 # pin to full commit SHA before production
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned tools and build the OPA policy bundle
        run: |
          bash scripts/fetch-tools.sh
          bash scripts/policy.sh build

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4 # pin to full commit SHA before production
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: vsp-release-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2 # pin to full commit SHA before production

      - uses: docker/setup-buildx-action@v3 # pin to full commit SHA before production

      - name: Build and push (immutable tag = commit SHA; deployed by digest)
        id: build
        uses: docker/build-push-action@v6 # pin to full commit SHA before production
        with:
          context: .
          file: platform/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record image reference
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p evidence/runs
          echo "IMAGE_REF=${REGISTRY}/${REPOSITORY}@${DIGEST}" >> "$GITHUB_ENV"
          echo "${REGISTRY}/${REPOSITORY}@${DIGEST}" > evidence/runs/image-ref.txt

      - name: Image vulnerability scan (Trivy, pinned binary; fail on fixable HIGH/CRITICAL)
        run: |
          bash scripts/ci/fetch-ci-tool.sh trivy
          .tools/trivy image --format sarif --output evidence/runs/trivy.sarif "${IMAGE_REF}"
          .tools/trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE_REF}"

      - name: SBOM (CycloneDX 1.5) and license inventory
        run: |
          pnpm list -r --json --depth Infinity > evidence/runs/pnpm-list.json
          pnpm licenses list --json > evidence/runs/licenses.json
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/ci/sbom.mjs \
            --input evidence/runs/pnpm-list.json \
            --licenses evidence/runs/licenses.json \
            --output evidence/runs/sbom.cdx.json

      - name: Sign image and attest SBOM (cosign keyless)
        run: |
          bash scripts/ci/fetch-ci-tool.sh cosign
          .tools/cosign sign --yes "${IMAGE_REF}"
          .tools/cosign attest --yes --type cyclonedx --predicate evidence/runs/sbom.cdx.json "${IMAGE_REF}"

      - name: Generate release manifest (evaluation module; never fabricates approvals)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! grep -qs "release-manifest" platform/src/evaluation/cli.ts; then
            echo "::error::platform/src/evaluation/cli.ts has no 'release-manifest' command (owner: evaluation engineer); cannot generate the manifest"
            exit 1
          fi
          pnpm --filter @vsp/platform evidence release-manifest \
            --environment "${TARGET_ENVIRONMENT}" \
            --image-digest "${DIGEST}" \
            --source-commit "${GITHUB_SHA}" \
            --build-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --out "${GITHUB_WORKSPACE}/evidence/runs/release-manifest.json"

      - name: Check the manifest is well formed (decision recorded, not enforced here)
        run: |
          platform/node_modules/.bin/tsx scripts/ci/check-release-manifest.ts \
            --manifest evidence/runs/release-manifest.json \
            --environment "${TARGET_ENVIRONMENT}" \
            --image-digest "${IMAGE_REF##*@}" \
            --source-commit "${GITHUB_SHA}" > evidence/runs/release-manifest-gate.json || true
          cat evidence/runs/release-manifest-gate.json

      - name: Sign the release manifest (cosign keyless blob signature)
        run: |
          .tools/cosign sign-blob --yes \
            --bundle evidence/runs/release-manifest.sigstore.json \
            evidence/runs/release-manifest.json

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4 # pin to full commit SHA before production
        with:
          name: release-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
