      followOnId: FO-02-01
      threatIds: [T-01, T-02, T-03, T-29]
      positiveTests:
        - { file: platform/src/adapters/local/identity-directory.test.ts, title: "name + DOB match exactly after normalisation and only locate a candidate" }
      adversarialTests:
        - { file: platform/src/identity/verification-service.test.ts, title: "name + DOB, caller ID and NPI-like claims never raise assurance" }
      failureInjectionTests:
        - { file: platform/test/invariants/failure-injection.test.ts, title: "the secure-link notification channel and the identity directory fail" }
      evidenceArtifact: "evidence/test-reports/traceability.json#invariants/AUTH-01"
      ownerRole: "Identity and access owner"
      ownerPackage: WP-43
      activationDependency: [AIN-12, AIN-15]
      secondaryPackages: [WP-05, WP-10, WP-12, WP-13, WP-16, WP-19]
