# Requirement catalogue (spec: docs/spec/voice-support-specification.txt).
#
# Every acceptance invariant (exact text) and the specification requirements as
# SPEC-<section>.<topic> ids. Each entry names where the requirement is enforced
# (module paths), how it is verified, and whether verification beyond the offline
# slice is externally BLOCKED (owner prerequisite in docs/prerequisites.yaml).
# `aliases` maps tags that tests already use to the canonical id.
#
# Every invariant carries an invariant `register` (FO-02-28, work package WP-01): the follow-on row, the
# threat-model rows it mitigates, positive / direct adversarial / failure-injection tests (file plus a
# distinctive part of the test title), the evidence artifact, the owner role and package, the activation
# register dependencies, the secondary packages that add tests at their own boundary and open register gaps.
# platform/test/invariants/register.test.ts fails when any attribute is missing or stale.
#
# The traceability generator (platform/src/evaluation/traceability.ts) reads this
# file, scans test titles for [TAG]s and renders docs/REQUIREMENTS_TRACEABILITY.md.
# Release status is never inferred from this file alone: IMPLEMENTED_OFFLINE needs
# at least one tagged test and every tagged test passing in a recorded run.
catalogVersion: "2026-10-19.1"
source: docs/spec/voice-support-specification.txt
verificationTypes: [unit, property, contract, adversarial, workflow, audio, load, manual, operational]
requirements:
  # ---------------------------------------------------------------- invariants
  - id: AUTH-01
