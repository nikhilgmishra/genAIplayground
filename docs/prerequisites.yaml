# Prerequisite register (machine-readable). Human rendering: docs/PREREQUISITES.md.
#
# Every entry under `records` strictly matches PrerequisiteRecord in
# platform/src/protocol/release.ts (unknown keys are rejected) and is validated by
# platform/test/docs/prerequisites.test.ts.
#
# Rules (spec section 5, invariants OPS-03 / OPS-05):
#  * UNKNOWN and BLOCKED are valid states and are NEVER equivalent to approved.
#    UNKNOWN  = the state of the external artifact cannot be determined from this
#               repository (no production or vendor account was inspected).
#    BLOCKED  = the artifact is known to be absent from what engineering can use, so
#               the gate cannot pass.
#  * Only the named human owner moves a record to EVIDENCED or APPROVED, and only with
#    an evidenceRef and approvalDate. The coding agent never sets these fields.
#  * Evidence must identify the exact tenant, SKU, region, feature and model where relevant.
#  * Missing secrets block integration execution, not offline coding.
#
# `annotations` carries cross-references that are not part of the strict record
# schema (spec row, trust-boundary flag, vendor questions, approval requests).
# Vendor question ids (VQ-*) live in talkdesk/vendor-questions.md; capability gate ids
# (CG-*) in talkdesk/capability-gate.md; approval request ids (AR-*) in
# docs/release/approval-requests.md.

schemaVersion: vsp.prerequisites.v1
asOf: "2026-10-17"
recordSchema: platform/src/protocol/release.ts#PrerequisiteRecord
statusMeaning:
  UNKNOWN: "State of the external artifact not determinable from the repository; not approved."
  BLOCKED: "Artifact known to be missing for engineering use; gate cannot pass; not approved."
  REQUESTED: "Owner has been asked through the approval-request pack; not approved."
  IN_PROGRESS: "Owner is producing the artifact; not approved."
  EVIDENCED: "Evidence reference exists and was reviewed by the owner (requires evidenceRef and approvalDate)."
  APPROVED: "Signed human approval exists (requires evidenceRef and approvalDate; approval record in approvals/)."
  EXPIRED: "Previously approved or evidenced; expiryDate passed; treated as not approved."
  NOT_APPLICABLE: "Owner has recorded that the prerequisite does not apply (requires a reason in nextAction)."

