unownedByDesign:
- path: docs/spec/**
  reason: Verbatim specifications (the original specification and the follow-on prompt); never edited (follow-on prompt section 0).
- path: platform/migrations/0*.sql
  reason: Applied migrations are immutable; every schema change is a new platform/migrations/2NN0-2NN9 file owned by package WP-NN.
- path: LICENSE
  reason: Licence text, changed only by the repository owner, never by a work package.
