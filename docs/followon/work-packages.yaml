  invariantObligations:
  - AUTH-03
  - AUTH-05
  - DATA-01
  - DATA-04
  - ACT-04
  - SAFE-01
  - SAFE-05
  - OPS-03
  - OPS-04
  - OPS-06
  faultObligations: []
  faultInjectionPoints: []
  owns:
  - platform/src/evaluation/*.ts
  - evidence/evaluation/**
  - docs/requirements/**
  - docs/adr/proposed/WP-01-*
  ownsGroups:
  - traceability
  - threat-model
  - corpus
  - journeys-harness
  - invariants
  excludes: []
  deliverables:
  - Fresh corpus run after fix wave 5 written as a new historical run (evidence/evaluation/corpus-local-<date>w5.*); the w4 summary, report and root-cause files stay unchanged; supersedes/rerunOf fields link the two.
  - Root-cause classification of every historical FAIL/INCONCLUSIVE into product, fixture, scorer or expectation defect, each with a rerun result.
  - Required-scenario manifest per gate; taskCompletionRate and every rate computed over the fixed denominator (INCONCLUSIVE, NOT_RUN and skipped count as not-PASS); coverage-hole section in the aggregate.
  - Family-level split key (intent skeleton plus account) with a leakage check across dev, tuning, held-out and regression corpora; corpus diff check that requires a review record for any expectation change.
  - A mutation test per scorer gate proving the gate can FAIL; fault scenarios PASS only when the intended fault point was reached and postconditions held.
  - 'Fixed fault registry: scenarios/fixtures/failures holds a plan for each of the 50 fault ids of the FO-17-24.<FAULT_ID> rows (25 existing plans plus the 25 prompt section 17 items), each naming its injection point, the packages that build it and the package that owns its Layer-2 run (injectionPointPackages and workPackage of its FO-17-24 row); only the POLICY_ENGINE_ERROR injection point (a fault-injecting decorator around the in-process OPA WASM engine, an accepted Layer-2 protocol) and its [FAULT:POLICY_ENGINE_ERROR] test are built here, and the in-process local-driver injection of the other plans is never cited as a Layer-2 run; a fault without a reached-and-asserted run is INCONCLUSIVE and listed as a coverage hole.'
  - 'EvaluationResult population using the WP-02 fields: version digests, seed, split, requestedFault and reachedFault from independent evidence (not driver self-report), rerunCommand, judge labels and audio evidence refs.'
  - 'Invariant register: docs/requirements/catalog.yaml extended with enforcement location, threat id, positive/adversarial/failure-injection test ids, evidence artifact, owner role, activation dependency and the secondary packages of each FO-02-xx row for all 27 invariants; platform/test/invariants/** holds the register test; failure-injection tests for AUTH-03, AUTH-05, DATA-01, DATA-04, ACT-04, SAFE-01, SAFE-05, OPS-04 and OPS-06; threat rows for DATA-02, DATA-03, ACT-04, SAFE-01, OPS-03 and OPS-05.'
  - Traceability generator reads docs/followon/requirements.yaml, gap-ledger.yaml and capabilities.yaml and emits Software, Environment and Qualification columns per requirement and per capability; it fails when an originalId does not resolve to docs/requirements/catalog.yaml, when a catalog id has no FO row, or when an AIN id is used as an originalId; one shared UNKNOWN-classification helper (FO-22-07). Owns evidence/test-reports/traceability.json in phase B (excluded from the WP-07 status-docs group).
  - Journey harness and the existing original-numbered journey tests (platform/test/journeys/harness.ts, README.md, j1-j9, faults, transactions, outcomes, recheck, safety-*) stay green as the scorer changes; WP-07 inherits them within phase B.
  acceptance:
  - pnpm --filter @vsp/platform exec vitest run src/evaluation (includes one mutation test per gate)
  - pnpm --filter @vsp/platform scenarios:check; the leakage check reports zero families shared across splits
  - pnpm --filter @vsp/platform evidence writes a new aggregate whose denominators equal the required manifests; git diff shows the w4 evidence files unchanged
  - pnpm --filter @vsp/platform exec vitest run test/docs src/evaluation/traceability.test.ts (every invariant names an existing failure-injection test id)
