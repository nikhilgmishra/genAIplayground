# Follow-on work packages (machine-readable): ordered, dependency-aware plan for phases B-H.
# Every MISSING/IMPLEMENTED requirement in docs/followon/gap-ledger.yaml belongs to exactly one package.
# GENERATED by docs/tools/followon/generate.py from docs/followon/source/; do not edit by hand.
schemaVersion: vsp.followon.work-packages.v2
asOf: '2026-10-19'
baseCommit: 8c0f5a0
generator: docs/tools/followon/generate.py
phases:
  B: Scorer truth, invariant regressions, production composition, storage/session/workforce identity/audit, real transport adapter boundaries
  C: Live model adapters, controllable media, protected output, fallback audio, turn/session fencing, real local audio-to-action journey
  D: Historical/event/live context, entity linking, knowledge ingestion, deletions, model registry (registry delivered in C as WP-09), specialist loops (delivered with WP-10), canonical domain adapters (WP-23 starts early for the phase C audio journey)
  E: Every workflow family, CRM/outbox sync, long-horizon work, secure companion, notifications, accepted human transfer
  F: Operator onboarding/studio/console, configuration publication, evidence views, eval platform, self-improvement
  G: Deterministic/contract/integration/security/audio/chaos checks, packaging, images, migrations/rollback, load/soak/DR, preflight, evidence
  H: Authorized external executions only with scoped authority; otherwise exact activation commands and remaining qualification
ownershipRules:
- Packages that can run in parallel (neither is a transitive dependency of the other) own disjoint paths; the generator (docs/tools/followon/generate.py) checks it, expanding shared groups and their excludes.
- 'Shared files change hands only between the owners listed per phase in sharedFiles. A phase lists one owner or an ordered list of owners that are dependency-ordered (each depends on the previous); a phase not listed has no owner and nobody edits the group in it. A feature package never edits a shared group it does not own: it delivers a module-local factory, config sub-schema, metric catalogue file (platform/src/observability/catalog/<module>.ts), guard rule file (platform/src/config/rules/<module>.ts), worker loop class, route module or compose fragment, and the phase integration package wires it.'
- Dependencies for every planned package are locked once by WP-03; a feature package that needs another dependency records it as a deliverable for the phase integration package instead of editing package.json or pnpm-lock.yaml.
- A package that owns a contract source file in platform/src/protocol owns the generated schemas/protocol/<Contract>.schema.json files of the contracts defined in it; adding a new contract to the registry (registry.ts/index.ts) is an integration step. WP-02 delivers the exact enum and field values later packages consume; the protocol files later packages extend are handed over explicitly (WP-02 notes).
- 'New migrations: package WP-NN owns platform/migrations/2NN0_*.sql to 2NN9_*.sql (for example WP-04 owns 2040-2049); numbering follows the dependency order.'
- New ADRs are drafted as docs/adr/proposed/<WP-id>-<slug>.md; the phase integration package assigns the next contiguous ADR number (docs-pack test requires contiguous numbering) and indexes it in docs/DECISIONS.md.
- 'Threat rows: each feature package drafts STRIDE rows for its boundary in docs/security/threats/proposed/<WP-id>-threats.md; the threat-model group owner of the phase merges them into docs/security/threat-model.md.'
- 'Journeys: each package owns its platform/test/journeys/jNN-*.test.ts files; the journey harness and the existing original-numbered journey tests belong to the journeys-harness group; WP-43 owns the whole directory in phase G.'
- 'Invariant obligations: every package listed in the secondaryPackages of an FO-02-xx row adds positive, adversarial and failure-injection tests for that invariant at its own boundary, in its own test directory, tagged with the invariant id; its acceptance lists the obligation (generated from the ledger). platform/test/invariants/** holds the register and the cross-adapter suite (WP-01 in B, WP-43 in G).'
- 'Fault injection: the package that owns an FO-17-24.<FAULT_ID> row runs its Layer-2 test tagged [FAULT:<id>], which proves the fault was reached and asserts the postconditions. Each row names injectionPointPackages (the packages that build the injection point as a seam with its own local test) and postconditionPackages (the packages whose components the asserted postconditions observe); the owner is one of them or depends on every one of them, which the generator checks. WP-01 owns the fault plans, WP-34 wires the injection points into the evaluation drivers and WP-42 gates the denominator.'
- 'Early start: a later-phase package marked earlyStart depends only on earlier phases and may be a dependency of an earlier phase package; the generator checks both conditions.'
- 'Compose: WP-03 owns deploy/local/compose.yaml and services/core.compose.yaml; other packages own deploy/local/services/<name>.compose.yaml files, which the runner loads automatically.'
- 'Runbooks: each existing runbook body under docs/RUNBOOKS belongs to its domain package until phase G, when WP-44 owns docs/RUNBOOKS/**; docs/RUNBOOKS/README.md is in the status-docs group.'
- 'Operations controls: platform/src/ops/** (kill switches, admission, budgets, capacity, integration gate) is the ops shared group with an owner in every phase; WP-27 alone owns platform/src/ops/notification-gate.ts and its test until phase G. A feature package that needs a switch or an admission class delivers a module-local port (for example a VersionGate or OutboundCallGate interface in its own module) and the phase owner of the ops and composition groups implements it with platform/src/ops; modules under the WP-06 import allowlist (harness, models, prompts, media/) never import platform/src/ops, and the media worker receives switch decisions from the control plane through the generated gateway client.'
- 'Media path after creation: media/src/** and media/test/** form the media shared group (C WP-17, D WP-25, E WP-30, F WP-38, G WP-43; media/src/main.ts stays in the composition group and media/src/transfer/** with WP-28 until phase G), so a defect that a later journey or fault run finds on the media path (J12, RECORDING_REFUSED, CONSENT_REVOKED, live-call join) has an owner in that phase; the phase C feature packages own their own subtrees while they build them.'
- 'Phase G closure: WP-43 owns every source tree in phase G (platform/src, media/src, media/test, companion/src, console/src, console/e2e, services/*/src and sidecars, including the release-manifest builder, the ReleaseManifest contract and the migration runner after WP-40 and WP-41 have changed them) as well as the shared groups it lists, because every earlier owner is its ancestor; a defect found by the phase G audio, chaos, companion, console or journey checks therefore always has an owner. WP-44 and WP-45 own documents, registers and qualification only.'
- 'Co-located files: a package that owns a source file D/Y.<ext> (ts, tsx, mts, cts, js, mjs, cjs) also owns its co-located tests D/Y.test.<ext> and D/Y.<suffix>.test.<ext> (the longest matching source wins, so pipeline.transactions.test.ts belongs to the owner of pipeline.ts), and a package that owns a directory-level pattern D/*.<ext> also owns D/README.md. The generator derives this ownership from the working tree and applies it in every ownership check, so a co-located test is never orphaned by a file-level owns entry.'
- 'Timely ownership: no file a phase B-F package needs waits for phase G. A file under platform/src, platform/test, console/src, console/e2e, media/src, media/test, companion/src, services/*/src or sidecars that a MISSING or IMPLEMENTED row of a phase B-F package cites (evidence, gap, remediation, acceptance), that a phase B-F package names in its deliverables, acceptance or notes, or that a file first owned in phases B-F imports, has an owner before phase G, and so does a file that imports a file first owned in phases B-F (a change there can break it in the default typecheck and test suites); the generator fails otherwise. A module owned from its feature phase onwards is the intended phasing (earlier rows cite it as context, and an earlier package that needs a change in it records the change for that owner); only a first owner in phase G is a hole, because then nobody can fix a defect found in it during phases B-F.'
- 'Unowned by design: every file in the working tree has an owner except the paths listed in unownedByDesign, which nobody edits (verbatim specifications, applied migrations, the licence); the generator fails on a file that has neither, and on a listed path that has an owner.'
- 'Data-flow rows: each feature package that adds or changes a data flow drafts DF rows in docs/privacy/data-flows/proposed/<WP-id>-flows.md; the data-flows group owner of the phase merges them into docs/privacy/data-flow-inventory.md (rows DF-27 onwards use the two status axes, ADR-0018 decision 7.5).'
- 'Journeys: a journey row (FO-20, J01-J20 and its split legs) names componentPackages, the packages that build the components its acceptance exercises or asserts; the owning package is one of them or depends on every one of them (no dependency inversion), which the generator checks as it does for the fault rows.'
- 'Release sequencing (decided): WP-40 builds the release machinery (images, SBOM, provenance, signing, ReleaseManifest bindings, preflight, build-release) and a first bundle on real artifacts so the bindings and signatures are exercised; WP-41 and WP-42 consume that bundle for deploy, rollback, load and chaos rehearsals; WP-43 re-runs the unchanged build-release and preflight after its closure fixes, and only that post-closure bundle, which binds the closure commit, can be cited as RELEASE_PACKAGE_VERIFIED evidence. The release step does not move after WP-43, because WP-41 to WP-43 need the release tooling and a signed bundle to exist.'
