- path: docs/PREREQUISITES.md
  generator: node docs/tools/render-prerequisites.mjs
  owner: WP-45 (structure only; records are moved by their human owners)
- path: pnpm-lock.yaml
  generator: pnpm install
  owner: deps group owner of the phase (WP-03, WP-17, WP-25, WP-30, WP-38, WP-40, WP-45)
