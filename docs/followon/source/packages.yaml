  - 'Compliance support registers: control register (requirement, control, owner, frequency, evidence collector, scope, exceptions), HIPAA safeguard mapping, SOC 2 scope document, counsel-facing content of the jurisdiction/processing-purpose matrix (schema and loader are WP-22, readiness consumption WP-32), FTC HBNR/FDA assessment triggers, operating-evidence templates; every cell pending counsel stays UNKNOWN.'
