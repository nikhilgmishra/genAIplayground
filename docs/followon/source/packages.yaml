generatedArtifacts:
- path: schemas/protocol/*.schema.json
  generator: pnpm --filter @vsp/platform schemas:gen
  owner: the package that owns the contract source file in platform/src/protocol; registry.ts/index.ts changes by the registry group owner of the phase
- path: schemas/openapi/gateway.openapi.json and platform/src/gateway-client/**
  generator: pnpm --filter @vsp/platform openapi:gen (client generator added by WP-07)
  owner: registry group owner of the phase (WP-07, WP-17, WP-25, WP-30, WP-38, WP-43)
- path: schemas/openapi/console.openapi.json
  generator: console contract generator added by WP-02
  owner: WP-02 in phase B, then the registry group owner of the phase
- path: schemas/tools/catalog.json
  generator: pnpm --filter @vsp/platform catalog:gen
  owner: registry group owner of the phase
- path: infra/stepfunctions/*.asl.json and manifest.json
  generator: pnpm --filter @vsp/platform asl:gen
  owner: WP-26 (only package that changes workflow definitions before phase G; WP-30 adds definitions after WP-26)
- path: docs/resolution-contracts.md
  generator: pnpm --filter @vsp/platform contracts:gen
  owner: owner of platform/src/business in the phase (WP-25 in D, WP-30 in E)
- path: docs/REQUIREMENTS_TRACEABILITY.md and evidence/test-reports/traceability.json
  generator: traceability generator in platform/src/evaluation (extended by WP-01)
  owner: traceability group owner of the phase (WP-01 in B, then the integration package; WP-44 in G)
- path: docs/followon/*.yaml, docs/GAP_CLOSURE.md, docs/ACTIVATION_REGISTER.md
  generator: python3 -I docs/tools/followon/generate.py (sources under docs/followon/source/; --check for drift)
  owner: status-docs group owner of the phase
- path: docs/PREREQUISITES.md
  generator: node docs/tools/render-prerequisites.mjs
  owner: WP-45 (structure only; records are moved by their human owners)
- path: pnpm-lock.yaml
  generator: pnpm install
  owner: deps group owner of the phase (WP-03, WP-17, WP-25, WP-30, WP-38, WP-40, WP-45)
packages:
- id: WP-01
  phase: B
  title: 'Test truth: scorer gates, fixed denominators, family splits, invariant register and two-axis traceability'
  goal: Every evaluation gate derives its verdict from authoritative evidence over a fixed required denominator, splits cannot leak variant families, the 27 invariants carry owner/threat/failure-injection records, and the traceability generator reports both status axes plus qualification from docs/followon/*.yaml.
  size: L
  dependsOn:
  - WP-02
  owns:
  - platform/src/evaluation/*.ts
  - evidence/evaluation/**
  - docs/requirements/**
  - docs/adr/proposed/WP-01-*
  ownsGroups:
  - traceability
  - threat-model
  - corpus
  - journeys-harness
  - invariants
  excludes:
  - platform/src/evaluation/manifest.ts
  deliverables:
  - Fresh corpus run after fix wave 5 written as a new historical run (evidence/evaluation/corpus-local-<date>w5.*); the w4 summary, report and root-cause files stay unchanged; supersedes/rerunOf fields link the two.
  - Root-cause classification of every historical FAIL/INCONCLUSIVE into product, fixture, scorer or expectation defect, each with a rerun result.
  - Required-scenario manifest per gate; taskCompletionRate and every rate computed over the fixed denominator (INCONCLUSIVE, NOT_RUN and skipped count as not-PASS); coverage-hole section in the aggregate.
  - Family-level split key (intent skeleton plus account) with a leakage check across dev, tuning, held-out and regression corpora; corpus diff check that requires a review record for any expectation change.
  - A mutation test per scorer gate proving the gate can FAIL; fault scenarios PASS only when the intended fault point was reached and postconditions held.
  - 'Fixed fault registry: scenarios/fixtures/failures holds a plan for each of the 50 fault ids of the FO-17-24.<FAULT_ID> rows (25 existing plans plus the 25 prompt section 17 items), each naming its injection point and owning package; injection points on existing components are built here (AUTH_EXPIRY_MID_CALL, CONCURRENT_SAME_ACCOUNT, CHANGED_SLOT_DURING_CONFIRMATION, DELEGATION_REVOKED, CONSENT_REVOKED, POLICY_ENGINE_ERROR); a fault without a reached-and-asserted run is INCONCLUSIVE and listed as a coverage hole.'
  - 'EvaluationResult population using the WP-02 fields: version digests, seed, split, requestedFault and reachedFault from independent evidence (not driver self-report), rerunCommand, judge labels and audio evidence refs.'
  - 'Invariant register: docs/requirements/catalog.yaml extended with enforcement location, threat id, positive/adversarial/failure-injection test ids, evidence artifact, owner role, activation dependency and the secondary packages of each FO-02-xx row for all 27 invariants; platform/test/invariants/** holds the register test; failure-injection tests for AUTH-03, AUTH-05, DATA-01, DATA-04, ACT-04, SAFE-01, SAFE-05, OPS-04 and OPS-06; threat rows for DATA-02, DATA-03, ACT-04, SAFE-01, OPS-03 and OPS-05.'
  - Traceability generator reads docs/followon/requirements.yaml, gap-ledger.yaml and capabilities.yaml and emits Software, Environment and Qualification columns per requirement and per capability; it fails when an originalId does not resolve to docs/requirements/catalog.yaml, when a catalog id has no FO row, or when an AIN id is used as an originalId; one shared UNKNOWN-classification helper (FO-22-07). Owns evidence/test-reports/traceability.json in phase B (excluded from the WP-07 status-docs group).
  - Journey harness and the existing original-numbered journey tests (platform/test/journeys/harness.ts, README.md, j1-j9, faults, transactions, outcomes, recheck, safety-*) stay green as the scorer changes; WP-07 inherits them within phase B.
  acceptance:
  - pnpm --filter @vsp/platform exec vitest run src/evaluation (includes one mutation test per gate)
  - pnpm --filter @vsp/platform scenarios:check; the leakage check reports zero families shared across splits
  - pnpm --filter @vsp/platform evidence writes a new aggregate whose denominators equal the required manifests; git diff shows the w4 evidence files unchanged
  - pnpm --filter @vsp/platform exec vitest run test/docs src/evaluation/traceability.test.ts (every invariant names an existing failure-injection test id)
  - 'python3 -I docs/tools/followon/generate.py --check (the traceability inputs are consistent: every originalId resolves, every catalog id is covered)'
  - pnpm --filter @vsp/platform exec vitest run test/invariants (register lists all 27 invariants with their secondary packages and existing test ids)
  externalActivation:
  - 'AIN-31: scenarios count as HUMAN_REVIEWED only with real reviewer records; nothing in this package can mark them reviewed.'
  notes: []
- id: WP-02
  phase: B
  title: 'Contract registry: the 34 follow-on contracts, common envelope and two-axis status types'
  goal: One maintained zod source defines every follow-on contract (strict, versioned, bounded) and generates the JSON Schemas, OpenAPI and TypeScript types, so later packages only refine fields of contracts that already exist.
  size: L
  dependsOn: []
  owns:
  - platform/src/protocol/**
  - schemas/protocol/**
  - approvals/schema/**
  - schemas/openapi/console.openapi.json
  - docs/security/threats/proposed/WP-02-*
  ownsGroups: []
  excludes: []
  deliverables:
  - 'New contract files: protocol/call-binding.ts (CallBinding; WP-11 owns it from phase C), protocol/media.ts (TurnEnvelope, CarrierEvent, SpeechPlan, AudioReleaseReceipt), protocol/context-facts.ts (ContextFact, SourceWatermark), protocol/identity-link.ts (IdentityLink), protocol/context-snapshot.ts (ContextSnapshot), protocol/knowledge.ts (KnowledgeCitation), protocol/models.ts (ModelInvocation, ModelDecision), protocol/effects.ts (EffectVerification, CaseLink), protocol/connector.ts (ConnectorProfile, CapabilityEvidence; WP-06 then WP-32 own it), protocol/improvement.ts (ChangeProposal, CanarySpec), protocol/activation.ts (ActivationReport, ActivationRecord), protocol/review.ts (ReviewRecord, DatasetItem), protocol/plan.ts (LongHorizonPlan).'
  - ConfirmationReceipt (alias of ActionConfirmation plus actorRef and expiresAt), ActionGrant, HumanTask and TenantConfig registered; AuthContext gains processingBasis; SupportRequest moves CRM ids into CaseLink; EvaluationResult gains local_emulator, model_text and audio execution modes; ToolResult carries freshness/watermark refs.
  - 'Two-axis status types: SoftwareStatus, EnvironmentStatus and QualificationResult replace the single-axis ReleaseStatus in ReleaseManifest and capability records (old values mapped, not silently dropped).'
  - Common envelope mixin (tenant_id, interaction_id, case_id, workflow_id, opaque actor/subject refs, session_generation, turn_id, request_id, causation_id, schema_version, occurred_at); Pagination, TimeRange, Money (ISO 4217 enum, integer minor units) and UTC instant plus business timezone primitives; bounded lengths everywhere.
  - FOLLOWON_CONTRACTS registry test (34 names plus alias map) that fails on an absent, non-strict or unversioned contract; cardinality tests (one person many roles, many cases per call, many calls per case).
  - Console API contract moved into the zod registry with generated schemas/openapi/console.openapi.json.
  - 'Exact enum and field values that later packages consume without editing the shared files: Outcome per issue (common.ts) RESOLVED_WITH_EVIDENCE, INFORMATION_PROVIDED, REQUEST_ACCEPTED, WAITING_FOR_SYSTEM, WAITING_FOR_HUMAN, WAITING_FOR_CALLER, TRANSFERRED_WITH_ACCEPTANCE, DECLINED_BY_POLICY, CALLER_DISCONNECTED, FAILED, OUTCOME_UNKNOWN plus reopened and partiallyResolved flags (existing RESOLVED and TRANSFERRED mapped, not dropped); ConsentValue GRANTED, DECLINED, UNKNOWN, EXPIRED, NOT_REQUIRED with expiresAt and the consent dimensions recording, transcriptionAiProcessing, supportPurpose, disclosureAuthority, notificationSubscription and marketing; TransferState adds RECEIVER_DECLINED (support.ts); WorkflowStateName adds INVESTIGATING, VERIFYING_EFFECT and EXPIRED (workflow.ts); AuthContext/auth.ts channel adds conversation_runtime; EvaluationResult adds seed, requestedFault, reachedFault, rerunCommand, judgeLabels, audioEvidenceRefs and the local_emulator, model_text and audio execution modes; AuditManifest adds signature {algorithm, keyRef, value}, signedAt and signerRole; PolicyInput adds jurisdiction, processingPurpose and part2 {programRecord, consentRef}.'
  - 'Common envelope applied to the existing contracts that lack it (ToolRequest, PreparedAction, CommitReceipt, WorkflowEvent, HandoffPackage, AuditEvent, ScenarioDefinition, ApprovalRecord): schema_version, causation_id, tenant_id and session_generation where relevant, bounded `arguments`, versioned schema files.'
  - STRIDE threat rows for this package's boundary in docs/security/threats/proposed/WP-02-threats.md (merged into docs/security/threat-model.md by the phase integration package).
  acceptance:
  - pnpm --filter @vsp/platform schemas:check
  - pnpm --filter @vsp/platform exec vitest run src/protocol (FOLLOWON_CONTRACTS lists 34 contracts, all strict and versioned)
  - pnpm typecheck (platform and console compile against the generated types)
  - pnpm --filter @vsp/platform exec vitest run src/protocol (enum snapshot test pins the exact Outcome, ConsentValue, TransferState, WorkflowStateName and channel values above; every contract carries schema_version)
  externalActivation:
  - 'None: contracts carry no external dependency.'
  notes:
  - 'Protocol file hand-over after phase B: auth.ts WP-05; audit.ts WP-04; connector.ts WP-06 then WP-32; call-binding.ts WP-11; media.ts WP-14; policy.ts and common.ts WP-22 then WP-25; support.ts WP-28 then WP-29; models.ts WP-09; workflow.ts WP-26; evaluation.ts WP-34. A package that needs another protocol file change records it for the phase integration package.'
- id: WP-03
  phase: B
  title: 'Workspace baseline: pinned dependency set, workspace packages, Layer-2 emulator composition and runner skeleton'
  goal: Production adapters can be exercised over their real protocols against local emulators with one command, and every later package finds its dependencies already locked.
  size: L
  dependsOn: []
  owns:
  - deploy/local/services/core.compose.yaml
  - deploy/local/README.md
  - platform/test/integration/_harness/**
  - platform/vitest.integration.config.ts
  - scripts/vsp/up.mts
  - scripts/vsp/down.mts
  - .github/dependabot.yml
  - .nvmrc
  - scripts/fetch-tools.sh
  - media/tsconfig.json
  - companion/tsconfig.json
  - services/reference-business-api/tsconfig.json
  - docs/security/threats/proposed/WP-03-*
  ownsGroups:
  - deps
  - runner
  - ci
  excludes: []
  deliverables:
  - Exact-pinned dependency set for every planned package resolved from the registry and locked once (LiveKit server and RTC SDKs, OpenAI and Bedrock runtime clients, OpenTelemetry SDK and OTLP exporters, onnxruntime-node, Playwright with axe, parsers for PDF/DOCX, SES/SNS/Athena/Glue clients, gRPC/Avro for Salesforce Pub/Sub, dependency-cruiser); new workspace packages media/, companion/ and services/reference-business-api/ with skeleton package.json and tsconfig.
  - deploy/local/services/core.compose.yaml with digest-pinned postgres:16 with pgvector, amazon/dynamodb-local, ElasticMQ, MinIO with Object Lock, LocalStack (KMS, Secrets Manager, SNS, SES), Keycloak, Step Functions Local, Mailpit, ClamAV, livekit-server and livekit-sip; the runner loads every deploy/local/services/*.compose.yaml so later packages add services without editing compose.yaml.
  - 'Integration harness: VSP_INTEGRATION=1 vitest project (platform/vitest.integration.config.ts) that waits for service health, labels each test with the emulated service it used, and keeps unit fakes out of Layer 2.'
  - Makefile and scripts/vsp/runner.mts with doctor-free skeleton targets up, down, test-unit and test-integration; real exit codes preserved; no target calls a billable endpoint.
  - CI job that runs test-integration with the compose stack (Docker available in CI).
  - platform/vitest.config.ts split into unit, contract, docs and journey projects with a JSON reporter writing evidence/test-reports/vitest-<project>.json, so test-unit keeps the real exit code and produces its report (FO-19-67).
  - STRIDE threat rows for this package's boundary in docs/security/threats/proposed/WP-03-threats.md (merged into docs/security/threat-model.md by the phase integration package).
  acceptance:
  - make up PROFILE=core && make test-integration SUITE=_harness (health checks for every core service pass)
  - make down leaves no running containers or volumes (docker ps -a filtered by the project label is empty)
  - pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint
  - make test-unit returns the vitest exit code (a deliberately failing test makes it non-zero)
  - make test-unit writes evidence/test-reports/vitest-unit.json and its exit code equals the vitest exit code
  externalActivation:
  - 'None: emulators only; container images come from Docker Hub (reachable).'
  notes: []
- id: WP-04
  phase: B
  title: 'Durable substrate on real protocols: Postgres, DynamoDB, SQS, S3 Object Lock, KMS, durable route-audit journal and the authenticated inbound inbox'
  goal: The storage, session, queue, audit and inbound-event adapters that production uses run against real protocols (emulators), survive crashes, and never lose emergency-route evidence.
  size: L
  dependsOn:
  - WP-02
  - WP-03
  owns:
  - platform/src/db/**
  - platform/src/audit/**
  - platform/src/outbox/**
  - platform/src/identity/kv/**
  - platform/src/identity/assertions/**
  - platform/src/ingress/**
  - platform/src/gateway/http/webhook-routes.ts
  - platform/test/integration/substrate/**
  - platform/test/integration/ingress/**
  - scripts/vsp/verify-audit.mts
  - platform/migrations/204*
  - platform/src/observability/catalog/substrate.ts
  - docs/adr/proposed/WP-04-*
  - docs/RUNBOOKS/audit-sink-outage.md
  - platform/src/protocol/audit.ts
  - docs/security/threats/proposed/WP-04-*
  ownsGroups: []
  excludes: []
  deliverables:
  - 'Layer-2 contract tests: PgPoolDb (migrations, RLS, SERIALIZABLE retry, pool exhaustion, two-dispatcher contention) on postgres:16; DynamoKvStore (conditional writes, CAS, TTL is not a gate) on DynamoDB Local; SqsPublisher with DLQ on ElasticMQ; S3ObjectLockAuditSink (412 recovery, retention headers) on MinIO; KmsAssertionSigner on LocalStack KMS; DB role separation (key admin, app, audit writer, audit reader).'
  - Durable route-audit journal replacing the process-local deferral (audit_deferred table written in the handoff transaction plus route_audit_intents for detached tool executions); crash-restart test proves no emergency-route event is lost.
