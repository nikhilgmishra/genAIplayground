# Follow-on work-package source (plan, shared groups, ownership rules). Edit here; regenerate with python3 -I docs/tools/followon/generate.py.
# Requirement membership is not listed here: it comes from workPackage/regressionPackage in source/requirements/*.yaml.
phases:
  B: Scorer truth, invariant regressions, production composition, storage/session/workforce identity/audit, real transport adapter boundaries
  C: Live model adapters, controllable media, protected output, fallback audio, turn/session fencing, real local audio-to-action journey
  D: Historical/event/live context, entity linking, knowledge ingestion, deletions, model registry (registry delivered in C as WP-09), specialist loops (delivered with WP-10), canonical domain adapters (WP-23 starts early for the phase C audio journey)
  E: Every workflow family, CRM/outbox sync, long-horizon work, secure companion, notifications, accepted human transfer
  F: Operator onboarding/studio/console, configuration publication, evidence views, eval platform, self-improvement
  G: Deterministic/contract/integration/security/audio/chaos checks, packaging, images, migrations/rollback, load/soak/DR, preflight, evidence
  H: Authorized external executions only with scoped authority; otherwise exact activation commands and remaining qualification
ownershipRules:
- Packages that can run in parallel (neither is a transitive dependency of the other) own disjoint paths; the generator (docs/tools/followon/generate.py) checks it, expanding shared groups and their excludes.
- 'Shared files change hands only between the owners listed per phase in sharedFiles. A phase lists one owner or an ordered list of owners that are dependency-ordered (each depends on the previous); a phase not listed has no owner and nobody edits the group in it. A feature package never edits a shared group it does not own: it delivers a module-local factory, config sub-schema, metric catalogue file (platform/src/observability/catalog/<module>.ts), guard rule file (platform/src/config/rules/<module>.ts), worker loop class, route module or compose fragment, and the phase integration package wires it.'
- Dependencies for every planned package are locked once by WP-03; a feature package that needs another dependency records it as a deliverable for the phase integration package instead of editing package.json or pnpm-lock.yaml.
- A package that owns a contract source file in platform/src/protocol owns the generated schemas/protocol/<Contract>.schema.json files of the contracts defined in it; adding a new contract to the registry (registry.ts/index.ts) is an integration step. WP-02 delivers the exact enum and field values later packages consume; the protocol files later packages extend are handed over explicitly (WP-02 notes).
- 'New migrations: package WP-NN owns platform/migrations/2NN0_*.sql to 2NN9_*.sql (for example WP-04 owns 2040-2049); numbering follows the dependency order.'
- New ADRs are drafted as docs/adr/proposed/<WP-id>-<slug>.md; the phase integration package assigns the next contiguous ADR number (docs-pack test requires contiguous numbering) and indexes it in docs/DECISIONS.md.
- 'Threat rows: each feature package drafts STRIDE rows for its boundary in docs/security/threats/proposed/<WP-id>-threats.md; the threat-model group owner of the phase merges them into docs/security/threat-model.md.'
- 'Journeys: each package owns its platform/test/journeys/jNN-*.test.ts files; the journey harness and the existing original-numbered journey tests belong to the journeys-harness group; WP-43 owns the whole directory in phase G.'
- 'Invariant obligations: every package listed in the secondaryPackages of an FO-02-xx row adds positive, adversarial and failure-injection tests for that invariant at its own boundary, in its own test directory, tagged with the invariant id; its acceptance lists the obligation (generated from the ledger). platform/test/invariants/** holds the register and the cross-adapter suite (WP-01 in B, WP-43 in G).'
- 'Fault injection: the package that owns an FO-17-24.<FAULT_ID> row builds that injection point in its own adapter, emulator or runtime with a Layer-2 test tagged [FAULT:<id>] that asserts the fault was reached and the postconditions held; WP-01 owns the fault plans, WP-34 wires injection points into the evaluation drivers and WP-42 gates the denominator.'
- 'Early start: a later-phase package marked earlyStart depends only on earlier phases and may be a dependency of an earlier phase package; the generator checks both conditions.'
- 'Compose: WP-03 owns deploy/local/compose.yaml and services/core.compose.yaml; other packages own deploy/local/services/<name>.compose.yaml files, which the runner loads automatically.'
- 'Runbooks: each existing runbook body under docs/RUNBOOKS belongs to its domain package until phase G, when WP-44 owns docs/RUNBOOKS/**; docs/RUNBOOKS/README.md is in the status-docs group.'
