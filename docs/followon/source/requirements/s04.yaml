  remediation: Move console API and new contracts into the zod registry; generate OpenAPI for console.
  size: M
  environmentDependency: none
  workPackage: WP-02
  provenance:
    origin: extraction
    waveUpdates:
    - wave: B1
      package: WP-02
      from: IMPLEMENTED
      to: IMPLEMENTED
