  evidence:
  - 'platform/test/integration/_harness/queue.test.ts: ''[FO-16-16][ACT-02] two concurrent dispatchers publish every outbox message exactly once to a FIFO queue'' (round 1 holds dispatcher A''s claim transaction open until B''s claim ran; asserts disjoint hand-offs of 4 and 4, no lock wait, every row handed to SqsPublisher exactly once, unique delivery, all rows DISPATCHED)'
  - 'queue.test.ts: FIFO dedupe on re-publish, redelivery after a consumer crash (PgConsumerDedup), handler-failure rollback, DLQ after maxReceiveCount (ElasticMQ)'
  - 'platform/test/integration/_harness/workflow.test.ts: ''[FO-16-16] callback_request runs ACCEPTED -> VALIDATING -> recheck ALLOW -> WAITING_FOR_HUMAN -> COMPLETED through task tokens'', redelivered-token and all-7-definitions tests'
  - 'mutation N1 (for update skip locked removed from platform/src/outbox/dispatcher.ts) caught on 4 of 4 runs: ''rows A held were re-claimed and handed again by B: expected [ Array(4) ] to deeply equal []''; N1d (plain FOR UPDATE) caught by the no-lock-wait assertion'
  gap: 'Step Functions Local accepts a callback for an execution that has already ended (AWS refuses it), so WP-26''s bridge must deduplicate. History limits, quotas, retry intervals and deadline timeouts are not exercised; the Step Functions bridge itself is WP-26. Step Functions Local 2.0.0 can also fail an execution with States.Runtime ''... is not valid JSON'' when a task-token callback arrives before it has recorded TaskSubmitted (seen once in Layer 2; deploy/local/README.md fidelity finding 1): workflow.test.ts waits for TaskSubmitted before signalling, and the WP-26 bridge must tolerate the gap (wait or retry).'
  remediation: Add ElasticMQ and Step Functions Local containers and tests.
