- id: FO-11-32
  section: '11'
  kind: software
  text: Classify every provider operation as idempotent (honours the provider idempotency key), lookup-capable (authoritative lookup by key or external reference within a documented visibility window) or neither; an uncertain non-idempotent or non-lookup-capable effect is never retried automatically and goes to an owned human task.
  acceptance: ProviderCommitPort (and the ConnectorProfile operation) declares {idempotencyKeyHonoured, lookupByKey, visibilityWindowMs}; stale-COMMITTING retry and retryAfterReconcile are refused for operations that do not honour keys when the outcome was UNKNOWN; contract tests with an emulator that ignores idempotency keys and one with delayed visibility show no duplicate effect.
  originalIds:
  - ACT-02
  - ACT-03
  derivedFrom: []
  capabilityIds:
  - actions.effects
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - platform/src/actions/ports.ts:29-44 ProviderCommitPort (commit/lookup/currentVersion only; no capability declaration)
  - platform/src/actions/action-service.ts:1093-1128 recordNotFound (NOT_FOUND returns the action to CONFIRMED and permits a retry with the same key, which is safe only if the provider dedupes on the key)
  - platform/src/actions/digest.ts:72 providerIdempotencyKeyFor (the key is sent whether or not the provider honours it)
  gap: The ledger assumes that every provider dedupes on the idempotency key and that lookup is authoritative and immediate. Neither assumption is declared or checked per operation. The prompt's 'never ... retry an uncertain non-idempotent effect' cannot be enforced without that classification.
  remediation: Add an OperationCapabilities declaration to ProviderCommitPort and ConnectorProfile. Gate retryAfterReconcile and stale-COMMITTING retries on it. Route non-idempotent UNKNOWN outcomes to a WAITING_FOR_HUMAN reconciliation task with an owner and deadline (FO-11-18). Add contract tests with a key-ignoring emulator and a delayed-visibility emulator (FO-11-17).
  size: M
  environmentDependency: Each system owner's documented idempotency and read-your-writes semantics (PRQ-005 family)
  workPackage: WP-25
  provenance:
    origin: challenge-missed
