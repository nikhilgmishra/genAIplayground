- id: FO-12-10
  section: '12'
  kind: software
  text: Vendor events, bounded polling and backoff drive workflow system steps (and reconcile workflow state with external state).
  acceptance: System-step drivers poll or consume events for each WAITING_FOR_SYSTEM state with bounded attempts and backoff and signal SYSTEM_CONFIRMED/REJECTED from authoritative evidence.
  originalIds:
  - SPEC-9.workflow
  - ACT-03
  derivedFrom: []
  capabilityIds:
  - workflows.durable
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - 'grep workflows.signal in platform/src (excluding tests): no production caller; only console human-task completion (console-api/plugin.ts:1035) and fixtures (console-api/fixtures/harness.fixture.ts:377)'
  gap: Nothing ever signals VALIDATE, SYSTEM_CONFIRMED, CALLER_RESPONDED etc. in production code; workflows only wait, escalate and accept human decisions.
  remediation: Add platform/src/workflows/drivers. A SystemStepDriver interface {workflowType, state, poll(instance) | onEvent(evt), maxAttempts, backoff, visibilityWindowMs} is registered per definition state. A worker loop takes each instance in VALIDATING or WAITING_FOR_SYSTEM and calls the domain adapter (scheduling, billing, claims or provider ports). It maps authoritative evidence to SYSTEM_CONFIRMED, SYSTEM_REJECTED or RETRYABLE_FAILURE with sourceRecordRefs, signals with a dedupeKey, and escalates when attempts run out. Inbound vendor events reach the same mapping through the durable inbox (FO-13-20). Test with one emulator per domain that returns delayed, duplicated and contradictory responses.
  size: XL
  environmentDependency: Domain system APIs/event feeds
  workPackage: WP-26
  provenance:
    origin: extraction
    challengeCorrected:
    - remediation
