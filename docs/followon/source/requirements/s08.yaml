- id: FO-08-37
  section: '8'
  subsection: Knowledge ingestion and management
  kind: software
  text: Knowledge approval is an accountable decision bound to the exact item digest. It comes either from an in-platform review by an authenticated MFA knowledge editor (with independent review where configured) or from a source-system publish state that the connector reads under a reviewed mapping. An approval asserted in ingest input by an untrusted caller or source is not accepted.
  acceptance: 'Tests: an ingest batch that claims approval.status APPROVED without a matching approval record (approver staff id, knowledge_editor role, MFA time, item digest) is stored as draft. Approving one version does not approve an edited version. Approval records are audited and shown in the knowledge UI. The Salesforce Knowledge mapping derives approval only from PublishStatus=Online under an approved mapping.'
  originalIds:
  - SPEC-9.knowledge-ingestion
  - OPS-06
  - AUTH-03
  derivedFrom: []
  capabilityIds:
  - knowledge.retrieval
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - platform/src/knowledge/ingest.ts:91-95 (APPROVED accepted when approvedBy matches the APPROVER regex and approvedAt is not in the future)
  - platform/src/knowledge/service.ts releaseHeld/rejectHeld (an MFA knowledge_editor check exists only for conflict-held items)
  gap: Whoever calls ingest asserts the approval field, so 'unapproved content is draft' (FO-08-10) and the index-poisoning defences (FO-08-09) depend on the honesty of the caller or source.
  remediation: Add knowledge_approvals (tenant, source_id, version, item_digest, approver_staff_id, role, mfa_at, decision, audit_event_id) and make servable require a matching approval row through a constraint or trigger. Add approve/reject console-api endpoints and UI (FO-08-02), and a per-source approval mapping in the knowledge ConnectorProfile (FO-06-99).
  size: M
  environmentDependency: Knowledge owners and editors with workforce SSO/MFA roles
  workPackage: WP-20
  provenance:
    origin: challenge-missed
- id: FO-08-38
  section: '8'
  subsection: Grounding and citations
  kind: software
  text: 'Retrieval uses the caller''s or subject''s applicable jurisdiction from a trusted source: the authenticated account or service location, or, for public information only, a confirmed caller-stated location. Sub-national items take precedence over national ones. When the jurisdiction is unknown or ambiguous for a jurisdiction-dependent question, the platform asks for clarification or escalates instead of serving a default-jurisdiction policy.'
  acceptance: 'Tests: a US-CA subject receives the US-CA item instead of the US item, and a US-NY subject receives the US item. An unknown-jurisdiction caller asking a state-dependent policy question gets a JURISDICTION_UNKNOWN clarification or escalation, not the national answer. For protected content the jurisdiction never comes from tool arguments.'
  originalIds:
  - SPEC-9.retrieval
  - AUTH-03
  derivedFrom: []
  capabilityIds:
  - knowledge.retrieval
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - platform/src/business/services/knowledge.ts:32-49 (DEFAULT_JURISDICTION 'US' constant passed to every search)
  - platform/src/knowledge/search.ts:114,234 (an item matches the given jurisdiction or its country prefix only)
  gap: Wrong-jurisdiction protection (FO-08-21) is applied against a service constant, so state-specific policies are never served and the national policy is served everywhere.
  remediation: Resolve jurisdiction into the server-established AuthContext/ContextSnapshot from the account system, or from a confirmed slot on the public path, and pass it to KnowledgeService.search. Rank exact sub-national matches above country matches, and return a typed JURISDICTION_UNKNOWN reason that routes to clarification (the typed reasons of FO-08-20/21).
  size: S
  environmentDependency: Authoritative source of service location per subject; policy owners' jurisdiction tags
  workPackage: WP-20
  provenance:
    origin: challenge-missed
