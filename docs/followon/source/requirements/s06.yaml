- id: FO-06-97
  section: '6'
  subsection: Configurable connectors (general)
  kind: software
  text: Inbound connector events and records (webhooks, CDC/Pub/Sub, CDP events, delivery receipts, incremental pulls) that still fail processing after bounded attempts go to an inbound dead-letter queue with alerting and audited operator replay. Checkpoints and watermarks never advance silently past a dead-lettered record.
  acceptance: 'Emulator test per inbound family: a poison event is retried with bounded backoff, then moves to INBOUND_DEAD with a reason code, increments vsp_inbox_dead_letter_total and raises an alarm. The stream''s watermark reports the gap. An audited operator replay (MFA, allowlisted reason code) reprocesses it exactly once, and a replay whose audit write fails is refused.'
  originalIds:
  - SPEC-8.outbox
  - OPS-01
  - OPS-03
  - ACT-02
  derivedFrom: []
  capabilityIds:
  - audit.independent
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - platform/src/outbox/dispatcher.ts:261-310 (DEAD state, listDead/requeueDead exist for OUTBOUND outbox messages only)
  - 'no inbound inbox table or consumer exists (grep inbound_events/inbox in platform/migrations and platform/src: none)'
  - c2 FO-06-10 limits the DLQ requirement to outbound deliveries; section 6 lists DLQ among the transport properties of every connector
  gap: The only DLQ is the outbound outbox. Nothing captures inbound processing failures, so a poison CDC or webhook event would either block its stream or be dropped.
  remediation: Add an INBOUND_DEAD state with attempts/last_error columns to the inbound inbox proposed in FO-07-17. Reuse PgOutboxDispatcher's bounded backoff and its audited requeueDead pattern for inbox consumers. Record the dead-lettered position as a gap in source_watermarks (FO-07-23), and expose list and replay in the console DLQ work queue (section 14).
  size: M
  environmentDependency: none for software; SQS DLQ in AWS for VERIFIED_SANDBOX
  workPackage: WP-04
  provenance:
    origin: challenge-missed
