- id: FO-06-101
  section: '6'
  subsection: Knowledge and channels (KB sources, secure web companion, email/SMS, outbound voice)
  kind: software
  text: Outbound voice calls go through the same consent, preference, quiet-hours and kill-switch decision as notifications. The callee starts at A0, so no protected content is spoken until the callee authenticates on that call. Voicemail receives only neutral approved content. Placement and answer/no-answer receipts are recorded and charged against the outbound budget.
  acceptance: 'Local SIP/softphone tests: a scheduled callback inside quiet hours is deferred. Opted-out or unknown consent suppresses the call. An answered call hears only a neutral greeting and the verification offer until A2. On voicemail detection only the neutral template plays. Each placement debits the outbound budget, and placement is refused when the outbound kill switch is off.'
  originalIds:
  - SPEC-9.notifications
  - AUTH-01
  - OPS-05
  - DATA-01
  derivedFrom: []
  capabilityIds:
  - voice.outbound
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - platform/src/workflows/notification-policy.ts:63 (voice suppressed unless outboundCallingEnabled; the function has no call sites)
  - platform/src/workflows/definitions/callback-request.ts:6 (automated outbound calling is not part of the workflow)
  gap: c2 FO-06-92 covers placement, kill switch and budget, but not the disclosure, consent and voicemail rules that make an outbound call safe.
  remediation: Route every outbound placement through decideNotification (once wired, FO-06-90) and a new OutboundCallGate (kill switch + budget + consent). Start the call session through SessionService at A0 with an outbound flag. Restrict templates to neutral ones until A2. Record placement and answer receipts in notification_deliveries (FO-06-91).
  size: M
  environmentDependency: Calling-consent policy, caller ID registration, outbound budget approval (OPS-05)
