- id: FO-06-01
  section: '6'
  subsection: Configurable connectors (general)
  kind: software
  text: Deliver real connector transports for every required connector family (Talkdesk/contact center, SIP, Salesforce, CDP, Snowflake, Iceberg/lakehouse, business systems, knowledge sources, notification channels, outbound voice); an interface plus a mock or a fixture-only adapter is insufficient.
  acceptance: Each family has a live adapter class (kind 'live') performing real network I/O over its documented protocol, composable outside local/ci, with a passing protocol-level contract test.
  originalIds:
  - OPS-03
  - OPS-04
  - SPEC-16.integration-records
  derivedFrom: []
  capabilityIds:
  - operator.onboarding
  softwareStatus: MISSING
  environmentStatus: NOT_CONFIGURED
  qualification: NOT_RUN
  evidence:
  - platform/src/adapters/README.md (only SalesforceRestSupportRecords is a real outbound live adapter; Talkdesk, scheduling, billing, claims, provider and relationship adapters are BLOCKED stubs)
  - platform/src/adapters/live/talkdesk-blocked.ts
  - platform/src/adapters/live/business-systems-blocked.ts
  - platform/src/adapters/live/blocked-set.ts
  - platform/src/main/container.ts:22-26,308-314 (sandbox/staging/production composition refused with LIVE_COMPOSITION_NOT_IMPLEMENTED)
  - 'repo-wide grep 2026-10-19: no Segment, Snowflake, Iceberg/Athena, SIP, softphone or LiveKit code'
  gap: One outbound live connector (Salesforce upsert) plus inbound JWT/OIDC verification exist; there is no connector runtime, and the composition root refuses every non-local environment, so even the Salesforce adapter cannot run in a deployment.
  remediation: Create platform/src/connectors/ with a shared ConnectorRuntime (profile loader, credential resolver, allowlisted HTTP client, budget/timeout/retry binding, checkpoint store, DLQ, health/readiness) and implement one live adapter per family; wire them into a live composition root.
  size: XL
  environmentDependency: none for software; vendor sandbox per family for VERIFIED_SANDBOX
  workPackage: WP-32
  provenance:
    origin: extraction
