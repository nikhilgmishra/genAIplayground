section1Reconciliation:
- requirement: FO-01-02
  observation: Control plane, thin MCP interface, OPA WASM, strict schemas, prepare/confirm/commit/reconcile, SQL outbox/audit, workflow definitions, safety/voice templates and a React console exist.
  currentTruth: Confirmed. 27 protocol schemas drift-checked; existence does not imply live operation.
- requirement: FO-01-03
  observation: Local composition uses PGlite, memory sessions, synthetic identity and business adapters; non-local composition is refused.
  currentTruth: 'Still true at 8c0f5a0: `platform/src/main/container.ts:308-313` refuses sandbox, staging and production.'
- requirement: FO-01-04
  observation: No real conversational LLM powers the local driver.
  currentTruth: 'Still true: the driver is the rule-based LOCAL SIMULATED COORDINATOR; no model SDK is a dependency.'
- requirement: FO-01-05
  observation: Speech queue and turn tracker are local fixtures.
  currentTruth: 'Still true: `platform/src/voice/speech-queue.ts`, `platform/src/voice/turns.ts` (InMemoryTurnTracker).'
- requirement: FO-01-06
  observation: Eighteen tools and seven workflow definitions are catalogued; recount.
  currentTruth: 'Recounted: 18 tools (`schemas/tools/catalog.json`), 7 definitions and 7 ASL files; protected reads and commits resolve to BLOCKED live adapters, so none is operational outside fixtures.'
- requirement: FO-01-07
  observation: 'Committed corpus: 2,711 runs, 2,386 PASS, 305 FAIL, 20 INCONCLUSIVE; historical offline records.'
  currentTruth: Confirmed from `evidence/evaluation/corpus-local-20261018w4.summary.json` (7 critical failures); it predates fix wave 5 (8c0f5a0) and no rerun is committed; qualification FAIL (local fixture).
- requirement: FO-01-08
  observation: AWS infrastructure is plan-only.
  currentTruth: 'Still true: never applied; Terraform tests run with mock providers only.'
- requirement: FO-01-09
  observation: Workforce SSO needs completion.
  currentTruth: 'Still true: `auth.oidcExchange` throws OIDC_NOT_CONFIGURED; BlockedWorkforceStaffDirectory.'
- requirement: FO-01-10
  observation: Actual call takeover needs completion.
  currentTruth: 'Still true: transfers exist only against the telephony fixture.'
- requirement: FO-01-11
  observation: Live IdP needs completion.
  currentTruth: 'Partly: JwksOidcVerifier is live code tested over loopback HTTP; discovery, directory and composition are absent.'
- requirement: FO-01-12
  observation: Vendor events need completion.
  currentTruth: 'Still true: only a LOCAL FIXTURE HMAC webhook scheme (local/ci only).'
- requirement: FO-01-13
  observation: Independent audit export needs completion and qualification.
  currentTruth: S3 Object Lock sink exists but was tested only with a stub client and is not composed outside local.
- requirement: FO-01-14
  observation: Domain effects need completion.
  currentTruth: 'Still true: scheduling, billing, claims and provider live adapters are BLOCKED stubs.'
- requirement: FO-01-15
  observation: PSTN behaviour needs completion and qualification.
  currentTruth: 'Still true: channel `pstn` is declared with no executor; no SIP path. Split: software FO-01-15 (WP-12), qualification FO-01-15a (WP-45).'
- requirement: FO-01-16
  observation: Draft templates are not approved live scripts.
  currentTruth: 'Confirmed and enforced: templates stay DRAFT/PENDING and the gate refuses them outside local.'
- requirement: FO-01-17
  observation: 'PR #2 KMS grant narrowing merged into the feature branch, not main.'
  currentTruth: 'Still true: `origin/main` = 4b0a5f9; 7d7ccfc reachable only from this branch (via 1f9d210).'
- requirement: FO-01-18
  observation: Review remaining policy-editor authority.
  currentTruth: Key administrators keep kms:PutKeyPolicy and can undo the CreateGrant narrowing; documented residual VSP-INF-02.
- requirement: FO-01-19
  observation: Emergency-route audit deferral was process-local.
  currentTruth: 'Still process-local at 8c0f5a0 (`platform/src/audit/deferred.ts:39-44`): fix wave 5 added draining at shutdown, not durability; a detached route-tool execution can also lose its event (FO-01-34).'
- requirement: FO-01-20
  observation: Retention declarations need direct review.
  currentTruth: Declared and tested; durations are null pending counsel; new datasets (audio, timelines, model logs) are not yet declared.
- requirement: FO-01-21
  observation: Release checks need direct review.
  currentTruth: Never executed; the image was never built; the base image is not digest-pinned; manifest signature is never produced.
- requirement: FO-01-22
  observation: Transfer event ordering needs direct review.
  currentTruth: Verified locally with fixture events (ADR-0017, out-of-order tests).
- requirement: FO-01-23
  observation: Scorer truthfulness needs direct review.
  currentTruth: Repairs merged in fix wave 5 (8c0f5a0) but not re-verified by a fresh corpus run; INCONCLUSIVE leaves the goal-completion denominator.
- requirement: FO-01-24
  observation: 'Lesson 1: in-app chat does not authenticate a phone caller.'
  currentTruth: Verified locally with the fixture IdP (secure link binds call and generation).
- requirement: FO-01-25
  observation: 'Lesson 2: separate client support from provider-approved actions.'
  currentTruth: Separation holds; provider-approved actions and shared domain contracts do not exist.
- requirement: FO-01-26
  observation: 'Lesson 3: provider actions use immutable proposals, digests, leases, idempotency, reconciliation.'
  currentTruth: Verified for client actions on single-connection PGlite; no provider-side action path.
- requirement: FO-01-27
  observation: 'Lesson 4: separate transport, conversation, case and action authority.'
  currentTruth: Case/action authority separated (durable grants); transport and conversation layers and CallBinding do not exist.
- requirement: FO-01-28
  observation: 'Lesson 5: judge audio before release; safety/error audio survives speaker or judge failure.'
  currentTruth: 'Missing: no audio generation, judge or fallback audio.'
- requirement: FO-01-29
  observation: 'Lesson 6: a mock CRM is not a Case integration.'
  currentTruth: The Salesforce REST adapter is real and emulator-tested but held in BLOCKED state and not composed.
- requirement: FO-01-30
  observation: 'Lesson 7: memory is not clinical truth; membership is not an authority service.'
  currentTruth: Memory part verified; no eligibility, referral or authorization connector ports exist.
- requirement: FO-01-31
  observation: 'Lesson 8: refresh, idle expiry, generation fencing, duplicates and accepted handoffs are cross-component.'
  currentTruth: Generation fencing, dedupe and accepted-handoff modelling verified locally; token refresh and idle expiry are absent.
