meta:
  asOf: '2026-10-19'
  baseCommit: 8c0f5a0
  branch: claude/spec-prompt-implementation-l9zicg
  method: 'Requirement extraction per prompt-section group (five chunks) followed by an independent skeptic challenge per chunk; challenge corrections override the original values and missed requirements are appended. A Phase A completeness critic then re-checked the result and this repair applied its findings: every VERIFIED_LOCAL row was re-opened against its cited tests under the strict rule, stale rows were refreshed against 8c0f5a0, the fault matrix was split per fault, section 23 constraints were added, original ids were reconciled with docs/requirements/catalog.yaml, and every row gained capability ids.'
