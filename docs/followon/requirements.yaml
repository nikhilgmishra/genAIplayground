  section: '6'
  subsection: Configurable connectors (general)
  text: Inbound connector events and records (webhooks, CDC/Pub/Sub, CDP events, delivery receipts, incremental pulls) that still fail processing after bounded attempts go to an inbound dead-letter queue with alerting and audited operator replay. Checkpoints and watermarks never advance silently past a dead-lettered record.
