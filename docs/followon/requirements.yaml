  text: Every knowledge source connector, not only Salesforce Knowledge (also reviewed URL allowlists, documents/object storage and the generic KB API), maps owner, version, ACL/audience, sensitivity, locale, jurisdiction and effective/expiry dates from source metadata, or from a reviewed per-source default bound to an approval. Items missing them are held as drafts.
