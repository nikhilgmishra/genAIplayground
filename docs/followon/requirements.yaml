  subsection: Talkdesk / contact center (incl. generic SIP and local softphone)
  text: The generic SIP connector authenticates and restricts peers per profile (digest credentials or mTLS, plus a signalling-source allowlist). It uses TLS signalling and SRTP media where the trunk documents them. It sends INVITE or REFER only to destination identifiers resolved from trusted configuration, never to a dial string supplied by a caller or a model.
