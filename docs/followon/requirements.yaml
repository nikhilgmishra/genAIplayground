  text: Knowledge approval is an accountable decision bound to the exact item digest. It comes either from an in-platform review by an authenticated MFA knowledge editor (with independent review where configured) or from a source-system publish state that the connector reads under a reviewed mapping. An approval asserted in ingest input by an untrusted caller or source is not accepted.
