- id: FO-10-19
  section: '10'
  text: No diagnostic or mental-state inference from prosody or voice.
  kind: constraint
  originalIds:
  - SAFE-01
  - DATA-02
  capabilityIds:
  - voice.speech
  acceptance: No prosody features are computed or stored; evaluation prohibits speak:mental_state_inference.
- id: FO-10-20
  section: '10'
  text: Return to legitimate work after an attack/refusal when safe; do not punish the caller with endless refusal or authentication for public information.
  kind: software
  originalIds:
  - SAFE-03
  - AUTH-01
  capabilityIds:
  - conversation.harness
  acceptance: 'J01 journey: malicious turn followed by a public FAQ request is answered at A0; refusal counters never block public help.'
- id: FO-10-21
  section: '10'
  text: 'Acknowledgments are brief and truthful: ''checking'' only when work is actually dispatched; filler never masks a stall or counts as useful-answer latency.'
  kind: software
  originalIds:
  - ACT-04
  capabilityIds:
  - voice.release_boundary
  acceptance: Harness emits status.checking only with an in-flight tool request id; latency metrics exclude acknowledgment-only audio.
- id: FO-10-22
  section: '10'
  text: 'SpeechPlan contract: utterance_class, exact text or bounded allowed paraphrase, source/receipt refs, protected slots, policy/auth/context versions, session/turn, expiry and output-decision digest.'
  kind: software
  originalIds:
  - ACT-05
  - OPS-06
  capabilityIds:
  - voice.release_boundary
  acceptance: Versioned SpeechPlan schema generated with the other contracts; gate consumes it; digest recomputation test.
- id: FO-10-23
  section: '10'
  text: 'Pre-emission check 1a: validate authorization before any applicable audio escapes.'
  kind: software
  originalIds:
  - ACT-05
  - AUTH-02
  capabilityIds:
  - voice.release_boundary
  acceptance: Protected classes require a current authorizationRef; tests show refusal and fallback.
- id: FO-10-24
  section: '10'
  text: 'Pre-emission check 1b: validate source freshness of the facts being spoken.'
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - context.assembly
  acceptance: SpeechPlan carries SourceWatermarks; the gate refuses facts older than the class freshness bound.
- id: FO-10-25
  section: '10'
  text: 'Pre-emission check 2: validate facts, amounts, dates, outcome language, scope and allowed wording.'
  kind: software
  originalIds:
  - ACT-05
  - ACT-04
  capabilityIds:
  - voice.release_boundary
  acceptance: Typed slot validation, approved template wording, post-render check; outcome-language templates never claim resolution without receipts.
- id: FO-10-26
  section: '10'
  text: 'Pre-emission check 3: render using the permitted path (approved template through the controlled TTS/audio queue).'
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.release_boundary
  acceptance: Only the controlled TTS adapter renders protected classes; native mode cannot render them (FO-10-35).
- id: FO-10-27
  section: '10'
  text: 'Pre-emission check 4: re-check session generation, turn and cancellation at enqueue AND at emission.'
  kind: software
  originalIds:
  - ACT-05
  - SPEC-11.barge-in
  capabilityIds:
  - voice.release_boundary
  acceptance: 'Runtime test: a barge-in between enqueue and playback drops the segment before any frame is sent.'
- id: FO-10-28
  section: '10'
  text: 'Pre-emission check 5: record approved content/audio digest and actual emitted/playback status (AudioReleaseReceipt).'
  kind: software
  originalIds:
  - ACT-05
  - OPS-01
  capabilityIds:
  - voice.release_boundary
  acceptance: Each released segment has a receipt with text digest, audio digest, emitted/played/interrupted status; audit evidence.
- id: FO-10-29
  section: '10'
  text: Enforce the five checks before ANY applicable audio escapes; the runtime, not a prompt, owns which audio reaches the caller.
  kind: software
  originalIds:
  - ACT-05
  derivedFrom:
  - TB-04
  capabilityIds:
  - voice.release_boundary
  acceptance: 'Audio-boundary test: protected content injected into a model response never reaches the far-end capture.'
- id: FO-10-30
  section: '10'
  text: Fixed clinician/legal-approved wording for safety, identity, disclosure and material commitments.
  kind: software
  originalIds:
  - SAFE-01
  - ACT-05
  - OPS-04
  capabilityIds:
  - voice.release_boundary
  acceptance: Outside local/ci only effectively APPROVED templates render; production refuses to start with unapproved required templates.
- id: FO-10-31
  section: '10'
  text: Deterministic trusted slots for financial and account facts.
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.release_boundary
  acceptance: FINANCIAL_FACT/PROTECTED_FACT require typed slots and source refs; money in integer minor units.
- id: FO-10-32
  section: '10'
  text: Permit bounded grounded paraphrase for low-risk explanation (LOW_RISK_GROUNDED) with approved output checks.
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.release_boundary
  acceptance: Paraphrase must cite knowledge citations, stay within length/scope bounds and pass output monitors; tests with injected unsupported claims.
- id: FO-10-33
  section: '10'
  text: Qualify exact readouts with pronunciation/number controls, listen-back tests and repetition when necessary (independent TTS can mispronounce).
  kind: evaluation
  originalIds: []
  capabilityIds:
  - voice.cascade
  acceptance: TTS lexicon/SSML controls for numbers, dates, names; listen-back via independent ASR on every protected template x slot sample; repeat-on-mismatch policy.
- id: FO-10-34
  section: '10'
  text: Do not claim mathematical audio fidelity from a transcript judge.
  kind: constraint
  originalIds:
  - OPS-03
  capabilityIds:
  - governance.documents
  acceptance: Docs/status never state fidelity from transcripts; evidence types distinguish audio, model transcript and ASR transcript.
- id: FO-10-35
  section: '10'
  text: Native audio generated behind a buffer is checked against authorized source facts and exact protected slots; if the mode cannot prevent unapproved speech it cannot speak protected responses (route that class to the controlled path).
  kind: software
  originalIds:
  - ACT-05
  derivedFrom:
  - TB-04
  capabilityIds:
  - voice.native
  acceptance: Native-mode adapter buffers audio, runs ASR + slot match before release; protected classes always switch to Mode A with old buffers revoked; tests show no overlap.
- id: FO-10-36
  section: '10'
  text: A judge alone is not an authorization boundary.
  kind: constraint
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.release_boundary
  acceptance: 'Architecture test: no release decision depends solely on a judge verdict; authorization comes from the gate.'
- id: FO-10-37
  section: '10'
  text: Keep actual audio, model transcript and independent ASR transcript as separate evidence.
  kind: software
  originalIds:
  - DATA-02
  capabilityIds:
  - voice.cascade
  acceptance: Evidence store records three artifacts per turn with separate retention classes; EvaluationResult references each.
- id: FO-10-38
  section: '10'
  text: Interruptions invalidate pending speech and ambiguous confirmations and increment turn revisions.
  kind: software
  originalIds:
  - ACT-01
  - ACT-05
  - SPEC-11.barge-in
  capabilityIds:
  - voice.release_boundary
  acceptance: Barge-in invalidates the confirmation turn and every pending action; later confirmation refused; turn tracker advances.
- id: FO-10-39
  section: '10'
  text: On interruption flush provider AND local playback buffers.
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.speech
  acceptance: 'Audio test: after barge-in no further bot frames are received at the far end beyond the stop budget; provider-side TTS stream cancelled.'
- id: FO-10-40
  section: '10'
  text: 'Cancelling speech does not prove a business action was cancelled: reconcile any dispatched action.'
  kind: software
  originalIds:
  - ACT-03
  capabilityIds:
  - voice.release_boundary
  acceptance: Barge-in during COMMITTING leaves the action in doubt with a durable invalidation request; reconciliation decides.
- id: FO-10-41
  section: '10'
  text: Late tool results may update a still-authorized case but may not speak into a new turn.
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.release_boundary
  acceptance: Stale turn/generation results are dropped silently by the gate while ledger/case updates still apply.
- id: FO-10-42
  section: '10'
  text: Call-owner leases and fencing prevent two replicas from speaking for the same call.
  kind: software
  originalIds:
  - ACT-05
  capabilityIds:
  - voice.release_boundary
  acceptance: DynamoDB (or Postgres) conditional call-owner lease with fencing token checked at every speech emission; two-replica test.
- id: FO-10-43
  section: '10'
  text: Fencing prevents two replicas from committing the same action/record.
  kind: software
  originalIds:
  - ACT-02
  capabilityIds:
  - actions.effects
  acceptance: 'Concurrent commits: one in-doubt commit per record, commit_attempt_id fencing, exactly one effect.'
- id: FO-10-44
  section: '10'
  text: Test worker crash, reconnect, session expiry, participant changes and rolling deploy for the voice runtime.
  kind: evaluation
  originalIds:
  - AUTH-04
  - ACT-02
  capabilityIds:
  - operations.resilience_cost
  acceptance: Chaos tests kill the media worker mid-turn, reconnect the participant, expire the session, change participants and roll the deployment; assertions on speech, authority and actions.
- id: FO-10-45
  section: '10'
  text: Authority, case state and accepted actions survive a crash (ephemeral audio frames need not).
  kind: software
  originalIds:
  - ACT-02
  - OPS-01
  capabilityIds:
  - operations.resilience_cost
  acceptance: 'Crash fixture: after restart the ledger, support requests and workflows are intact and reconciled.'
- id: FO-10-46
  section: '10'
  text: Recovery starts a correctly bound session or a human route.
  kind: software
  originalIds:
  - AUTH-04
  - OPS-02
  capabilityIds:
  - voice.media_runtime
  acceptance: After worker crash the caller is either re-bound to a new session generation via the trusted carrier binding or transferred to a human; never resumes the old generation.
- id: FO-10-47
  section: '10'
  text: Independently available, licensed, versioned fallback audio for model, ASR, TTS and judge failures.
  kind: software
  originalIds:
  - OPS-02
  - SAFE-03
  capabilityIds:
  - safety.routing
  acceptance: Clip manifest (template id, version, locale, sha256, licence); fault tests with each dependency down play the right clip.
- id: FO-10-48
  section: '10'
  text: A generative model must not generate its own last-resort safety/error instruction.
  kind: constraint
  originalIds:
  - SAFE-03
  capabilityIds:
  - safety.routing
  acceptance: Last-resort text comes only from fixed templates/clips; no model path can produce the fallback.
- id: FO-10-49
  section: '10'
  text: Keep the telephony route usable when the whole AI service is down (independent continuity route).
  kind: software
  originalIds:
  - OPS-02
  capabilityIds:
  - continuity.ai_off
  acceptance: 'Continuity routing tested: exhausted fallbacks route to OUTAGE_CONTINUITY and the call is never ended; vendor Studio continuity branch documented.'
- id: FO-10-50
  section: '10'
  text: Never leave a failed safety response as silence.
  kind: software
  originalIds:
  - SAFE-03
  capabilityIds:
  - safety.routing
  acceptance: With TTS/model down or safety template unapproved, an approved pre-rendered safety clip still plays while the route starts.
- id: FO-10-51
  section: '10'
  text: Measure end-of-caller-speech to first meaningful handset audio.
  kind: evaluation
  originalIds: []
  derivedFrom:
  - FOLLOWON-17 (latency targets)
  capabilityIds:
  - voice.cascade
  acceptance: vsp_turn_latency_ms emitted per turn from endpointing timestamp to first non-acknowledgment frame at the far end; p50/p95 reported separately for cold/ack/tool turns.
- id: FO-10-52
  section: '10'
  text: Measure actual barge-in onset to last audible bot audio, and detection latency separately.
  kind: evaluation
  originalIds: []
  derivedFrom:
  - FOLLOWON-17 (latency targets)
  capabilityIds:
  - voice.cascade
  acceptance: vsp_barge_in_stop_ms emitted; onset->detection and detection->stop reported separately.
- id: FO-10-53
  section: '10'
  text: Timestamp ASR, reasoning, tools, validation, synthesis, buffers and network separately.
  kind: evaluation
  originalIds: []
  capabilityIds:
  - voice.cascade
  acceptance: Per-turn trace spans for each stage with OpenTelemetry; breakdown report.
- id: FO-10-54
  section: '10'
  text: Cached clips and a fast local loop do not establish PSTN latency (report separately).
  kind: constraint
  originalIds:
  - OPS-03
  capabilityIds:
  - voice.cascade
  acceptance: Latency reports label measurement path (local loop vs PSTN); release targets require PSTN evidence.
- id: FO-11-01
  section: '11'
  text: Preserve the prepare -> confirm -> commit -> reconcile protocol.
  kind: software
  originalIds:
  - ACT-01
  - ACT-02
  - ACT-03
  - SPEC-8.ledger
  capabilityIds:
  - actions.effects
  acceptance: Ledger state machine with DB-enforced transitions; unit, property and fault tests pass.
- id: FO-11-02
  section: '11'
  text: Extend the protocol across real connectors (live ProviderCommitPort implementations for scheduling, billing, CRM and other domain systems).
  kind: software
  originalIds:
  - ACT-02
  - OPS-04
  capabilityIds:
  - domain.business_systems
  acceptance: Each live adapter passes the same commit/lookup/currentVersion contract tests against an emulator over its real protocol.
- id: FO-11-03
  section: '11'
  text: Model proposals cannot set actor, target authority, fees or success.
  kind: constraint
  originalIds:
  - AUTH-03
  - ACT-01
  capabilityIds:
  - conversation.harness
  acceptance: Server-established fields refused in tool arguments; fees and targets resolved from authoritative records; success only from receipts.
- id: FO-11-04
  section: '11'
  text: PreparedAction contains source-grounded target, operation, exact parameters, before-state/version, impact/fees, policy decision, expiration and canonical digest.
  kind: software
  originalIds:
  - ACT-01
  - SPEC-8.ledger
  capabilityIds:
  - actions.effects
  acceptance: Strict schema; digest recomputed over every field except digest/state; tampering detected.
- id: FO-11-05
  section: '11'
  text: PreparedAction records explicit preconditions and source provenance (source record refs/watermarks used to build it).
  kind: software
  originalIds:
  - ACT-01
  capabilityIds:
  - actions.effects
  acceptance: Preconditions list and SourceWatermark refs are digest-covered and rechecked at commit.
- id: FO-11-06
  section: '11'
  text: Present material consequences to the caller before confirmation.
  kind: software
  originalIds:
  - ACT-01
  - ACT-05
  capabilityIds:
  - actions.effects
  acceptance: Confirmation templates read back before/after values, visit type, provider and review reason; TC-07 renders the server-side prepared action.
- id: FO-11-07
  section: '11'
  text: ConfirmationReceipt binds a fresh affirmation on a trusted channel to the digest, actor, session and expiry.
  kind: software
  originalIds:
  - ACT-01
  capabilityIds:
  - actions.effects
  acceptance: Confirmation accepted only from telephony_control/portal with digest, session, generation and turn; freshness window enforced at commit.
- id: FO-11-08
  section: '11'
  text: An earlier 'yes', a provider approval for another subject, or a model-generated confirmation is never usable.
  kind: constraint
  originalIds:
  - ACT-01
  capabilityIds:
  - actions.effects
  acceptance: 'Tests: confirmation captured before preparedAt rejected; mcp_tools/console/worker/webhook channels cannot confirm; other session rejected; staff retry never replaces the caller''s authority.'
- id: FO-11-09
  section: '11'
  text: Material parameter changes require a new confirmation.
  kind: software
  originalIds:
  - ACT-01
  capabilityIds:
  - actions.effects
  acceptance: A different digest invalidates the pending action; a changed request supersedes the earlier one.
- id: FO-11-10
  section: '11'
  text: Commit atomically records durable intent, unique action/idempotency identity and authorization (with audit) before dispatch.
  kind: software
  originalIds:
  - ACT-02
  - OPS-01
  capabilityIds:
  - actions.effects
  acceptance: tx1 sets COMMITTING with attempt id and audits action.commit.started before any provider call; audit failure means no provider call.
- id: FO-11-11
  section: '11'
  text: Record an outbox entry for the dispatch before dispatch (transactional outbox) where the connector is asynchronous.
  kind: software
  originalIds:
  - ACT-02
  capabilityIds:
  - actions.effects
  acceptance: Async connectors are dispatched by an outbox consumer from a row written in the intent transaction; crash between intent and dispatch loses nothing.
- id: FO-11-12
  section: '11'
  text: Commit rechecks current authority, source state, confirmation and policy.
  kind: software
  originalIds:
  - ACT-01
  - AUTH-02
  - AUTH-04
  capabilityIds:
  - actions.effects
  acceptance: Deny/policy error, version change, stale confirmation, generation change, safety escalation, expired/revoked session each block commit with zero provider calls.
- id: FO-11-13
  section: '11'
  text: Enforce optimistic concurrency, action ownership leases, fencing and uniqueness.
  kind: software
  originalIds:
  - ACT-02
  capabilityIds:
  - actions.effects
  acceptance: row_version predicates, one in-doubt commit per record, commit_attempt_id fencing, stale COMMITTING lease expiry.
- id: FO-11-14
  section: '11'
  text: Retries use the same provider idempotency key, never a new action.
  kind: software
  originalIds:
  - ACT-02
  capabilityIds:
  - actions.effects
  acceptance: Stable key derived from action id on every attempt and reconciliation; property test with provider dedup disabled.
- id: FO-11-15
  section: '11'
  text: Track NOT_STARTED, DISPATCHED, COMMITTED, FAILED, UNKNOWN and reconciled states.
  kind: software
  originalIds:
  - ACT-03
  capabilityIds:
  - actions.effects
  acceptance: State model distinguishes not-started, dispatched/in-flight, committed, failed, unknown and reconciled, persisted with transitions.
- id: FO-11-16
  section: '11'
  text: 'A timeout may occur after the effect: reconcile with authoritative lookup, external key or receipt before any retry or announcement.'
  kind: software
  originalIds:
  - ACT-03
  capabilityIds:
  - actions.effects
  acceptance: Ambiguous timeout -> UNKNOWN; retry reconciles first; lookup COMMITTED records receipt with no second commit; lookup UNKNOWN keeps UNKNOWN.
- id: FO-11-17
  section: '11'
  text: '''Not found'' is not definitive before the provider''s documented visibility window.'
  kind: software
  originalIds:
  - ACT-03
  capabilityIds:
  - actions.effects
  acceptance: Per-connector visibility window in ConnectorProfile; NOT_FOUND inside the window keeps UNKNOWN; test with delayed-visibility emulator.
- id: FO-11-18
  section: '11'
  text: Route unreconcilable operations to a human; never guess or retry an uncertain non-idempotent effect.
  kind: software
  originalIds:
  - ACT-03
  - OPS-02
  capabilityIds:
  - actions.effects
  acceptance: After a bounded reconcile budget an UNKNOWN action opens an owned human task with a deadline; no blind retry.
- id: FO-11-19
  section: '11'
  text: 'EffectVerification independent of the model and response text: query the source or validate a trusted completion event, check exact target/new state/version, record receipt/evidence.'
  kind: software
  originalIds:
  - ACT-04
  - OPS-01
  capabilityIds:
  - actions.effects
  acceptance: After COMMITTED, a separate read of the source system (or a verified vendor event) confirms target, new state and version; EffectVerification record persisted; mismatch alarms.
- id: FO-11-20
  section: '11'
  text: For eventual consistency report accepted/pending until verified.
  kind: software
  originalIds:
  - ACT-04
  capabilityIds:
  - actions.effects
  acceptance: Outcome stays REQUEST_ACCEPTED/WAITING_FOR_SYSTEM until EffectVerification succeeds.
- id: FO-11-21
  section: '11'
  text: Compensation requires domain policy and current authority; it is not a generic inverse call.
  kind: constraint
  originalIds:
  - ACT-02
  capabilityIds:
  - actions.effects
  acceptance: No automatic compensation; any compensation is a separately prepared and confirmed domain action.
- id: FO-11-22
  section: '11'
  text: Reconcile case state and external state after restart.
  kind: software
  originalIds:
  - ACT-03
  - OPS-01
  capabilityIds:
  - workflows.durable
  acceptance: Stale COMMITTING/UNKNOWN actions and stale sync claims are reconciled by workers after a restart.
- id: FO-11-23
  section: '11'
  text: Allow synchronous approved actions within voice deadlines.
  kind: software
  originalIds: []
  derivedFrom:
  - FOLLOWON-17 (latency targets)
  capabilityIds:
  - actions.effects
  acceptance: Commit completes within the tool deadline; over-deadline commits return UNKNOWN/PENDING with an approved status utterance.
- id: FO-11-24
  section: '11'
  text: Long-running work uses a narrow durable ActionGrant tied to actor/subject, enumerated permitted steps, expiry and revocation, issued in the accepting transaction.
  kind: software
  originalIds:
  - SPEC-7.privilege-expiry
  - AUTH-04
  capabilityIds:
  - actions.effects
  acceptance: Grant check valid only for declared action, before expiry, while unrevoked; tenant isolated; issued atomically with workflow start.
- id: FO-11-25
  section: '11'
  text: ActionGrant also binds purpose, the exact prepared action (digest) or explicit parameter bounds, maximum uses and approval evidence.
  kind: software
  originalIds:
  - ACT-01
  - SPEC-7.privilege-expiry
  capabilityIds:
  - actions.effects
  acceptance: Grant schema has purpose, digest or bounds, maxUses with atomic decrement, approvalRef; tests for overuse and out-of-bounds parameters.
- id: FO-11-26
  section: '11'
  text: A grant never reuses an expired call token and never waives fresh confirmation for a different consequential transaction.
  kind: constraint
  originalIds:
  - ACT-01
  - AUTH-04
  capabilityIds:
  - actions.effects
  acceptance: Grants are independent records (no session bearer); a different consequential transaction requires a new PreparedAction confirmation.
- id: FO-11-27
  section: '11'
  text: Recheck authority before each disclosure or effect performed under a grant.
  kind: software
  originalIds:
  - AUTH-04
  - SPEC-9.recheck
  capabilityIds:
  - authority.registries
  acceptance: Guarded transitions call PreDisclosureRecheck with current consent/representation/account state/policy; deny records POLICY_CHANGED_PENDING_ACTION.
- id: FO-11-28
  section: '11'
  text: Ask through the secure companion when a material change needs new confirmation during long-running work.
  kind: software
  originalIds:
  - ACT-01
  capabilityIds:
  - companion.web
  acceptance: Workflow material change creates a new PreparedAction and sends a secure-link approval; portal_approval confirmation resumes the workflow.
- id: FO-11-29
  section: '11'
  text: Suspended work retains an owner and a deadline.
  kind: software
  originalIds:
  - SPEC-9.workflow
  capabilityIds:
  - actions.effects
  acceptance: Validator rejects any nonterminal state without owner queue, deadline, retry budget and routed escalation.
- id: FO-11-30
  section: '11'
  text: Support per-issue outcome labels RESOLVED_WITH_EVIDENCE / INFORMATION_PROVIDED / REQUEST_ACCEPTED / WAITING_FOR_SYSTEM / WAITING_FOR_HUMAN / WAITING_FOR_CALLER / TRANSFERRED_WITH_ACCEPTANCE / DECLINED_BY_POLICY / CALLER_DISCONNECTED / FAILED / OUTCOME_UNKNOWN.
  kind: software
  originalIds:
  - ACT-04
  - SAFE-04
  capabilityIds:
  - actions.effects
  acceptance: Issue-level outcome table keyed by issue/case; each label reachable only with its evidence rule; a call can carry several issues with different labels.
- id: FO-11-31
  section: '11'
  text: Preserve reopened and partially resolved states.
  kind: software
  originalIds:
  - ACT-04
  capabilityIds:
  - actions.effects
  acceptance: Issue outcome history keeps REOPENED and PARTIALLY_RESOLVED transitions append-only; repeat contact links to the reopened issue.
- id: FO-11-32
  section: '11'
  text: Classify every provider operation as idempotent (honours the provider idempotency key), lookup-capable (authoritative lookup by key or external reference within a documented visibility window) or neither; an uncertain non-idempotent or non-lookup-capable effect is never retried automatically and goes to an owned human task.
  kind: software
  originalIds:
  - ACT-02
  - ACT-03
  capabilityIds:
  - actions.effects
  acceptance: ProviderCommitPort (and the ConnectorProfile operation) declares {idempotencyKeyHonoured, lookupByKey, visibilityWindowMs}; stale-COMMITTING retry and retryAfterReconcile are refused for operations that do not honour keys when the outcome was UNKNOWN; contract tests with an emulator that ignores idempotency keys and one with delayed visibility show no duplicate effect.
- id: FO-12-01
  section: '12'
  text: Implement all existing workflows and the Section 20 catalogue through production drivers (Step Functions Standard worker/human-task bridge).
  kind: software
  originalIds:
  - SPEC-3.workflow-engine
  - SPEC-9.workflow
  capabilityIds:
  - workflows.durable
  acceptance: Generated ASL deployed in a sandbox; worker bridge executes system tasks, human tasks and rechecks via SQS with SendTaskSuccess/heartbeats; local equivalent passes the same tests.
- id: FO-12-02
  section: '12'
  text: Cases survive hang-up, model replacement, worker crash and deployment.
  kind: software
  originalIds:
  - ACT-04
  - OPS-01
  capabilityIds:
  - workflows.durable
