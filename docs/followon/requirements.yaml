  kind: software
  originalIds:
  - SPEC-9.retrieval
  - AUTH-03
  capabilityIds:
  - knowledge.retrieval
  acceptance: 'Tests: a US-CA subject receives the US-CA item instead of the US item, and a US-NY subject receives the US item. An unknown-jurisdiction caller asking a state-dependent policy question gets a JURISDICTION_UNKNOWN clarification or escalation, not the national answer. For protected content the jurisdiction never comes from tool arguments.'
