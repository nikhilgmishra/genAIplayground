  text: 'Fault matrix AUTH_EXPIRY_IDLE: Auth expires while idle. The fault is injected at its real injection point (session idle expiry (lastActivityAt) in the identity service and the DynamoDB session store), the run proves the fault point was reached, and the postconditions are asserted.'
