# WP-05: one-shot import of the SYNTHETIC client, provider, partner and workforce realms
# (deploy/local/keycloak/realms/*.json) into the composition's Keycloak through its admin API.
#
#   make up PROFILE=core,identity-realms
#
# Not part of the `core` profile: Layer-2 suites create their own throwaway realms through the admin API
# (uniqueName() realm names) and never depend on these. The importer leaves existing realms unchanged.
# Credentials come from the generated local state only (missing values make the importer refuse to run);
# the synthetic user password, TOTP secret and client secret entries are generated by the state step
# (scripts/vsp/up.mts, see deploy/local/keycloak/README.md).
services:
  keycloak-realm-import:
    image: keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    profiles: [identity-realms]
    networks: [vsp]
    entrypoint: ["/bin/bash", "/realm-import/import-realms.sh"]
    restart: "no"
    environment:
      KC_URL: https://keycloak:8443
    # The generated state file is read inside the container (no new interpolated variables, so `make up`
    # of other profiles is unaffected); the importer refuses to run when a value it needs is missing.
    volumes:
      - ./keycloak:/realm-import:ro
      - ${VSP_LOCAL_STATE_DIR:?run make up}/env:/state/env:ro
      - ${VSP_LOCAL_STATE_DIR:?run make up}/tls:/tls:ro
    depends_on:
      keycloak: { condition: service_healthy }
    labels:
      io.vsp.emulates: "synthetic client, provider, partner and workforce realms of the local OpenID Connect identity providers"
      io.vsp.protocol: "Keycloak admin REST API over HTTPS (kcadm.sh, certificate from the checkout's local CA)"
      io.vsp.not-emulated: "tenant IdP configuration, real users and groups, MFA enrolment policies, federation, SCIM provisioning"
      io.vsp.licence: "Apache-2.0"
